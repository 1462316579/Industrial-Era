name: android
on:
  push:
    branches: [android, main]

permissions:
  contents: read

jobs:
  universal:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Java (JDK 25)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android SDK build-tools, platform, NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;35.0.0" "platforms;android-36" "ndk;28.2.13676358" > /dev/null

      - name: Install Rust for Android and cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --target i686-linux-android \
            --target x86_64-linux-android
          rustup default stable
          cargo install cargo-ndk --version 3.5.4 --locked

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-universal

      - name: Unpack debug keystore
        env:
          KEYSTORE: ${{ secrets.INDUSTRIAL_ERA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p target/android
          echo "$KEYSTORE" | base64 -d > target/android/debug.keystore

      - name: Build universal APK (all ABIs in one file)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          HORIZON_ANDROID_KEY_ALIAS: industrial-era-debug
          HORIZON_ANDROID_STORE_PASSWORD: android
          HORIZON_ANDROID_KEY_PASSWORD: android
        run: |
          python3 packaging/android/build_apk.py --universal --profile quick

      - uses: actions/upload-artifact@v4
        with:
          name: industrial-era-apk-universal
          path: target/android/industrial-era-*-universal.apk
          if-no-files-found: error
          retention-days: 90
