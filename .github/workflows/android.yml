name: android
# All four Industrial Era APKs, on GitHub's runners: branch pushes and pull requests build each ABI and keep it
# as an artifact, signed with the debug key in INDUSTRIAL_ERA_DEBUG_KEYSTORE_BASE64 so one installs over another (a
# throwaway key where that secret is missing, as in a fork's pull request). A tag v* signs it with the release key held
# in the secrets of the `release` environment (INDUSTRIAL_ERA_KEYSTORE_BASE64, INDUSTRIAL_ERA_KEY_ALIAS,
# INDUSTRIAL_ERA_STORE_PASSWORD, INDUSTRIAL_ERA_KEY_PASSWORD) and publishes it as the latest release, with
# packaging/android/release-notes.md. The APK holds no game files: players prepare those from their own copy.
#
# The release key is Industrial Era's, in its `release` environment, which only the protected `main` branch and v*
# tags reach (a ruleset lets only admins push those tags). Every other build, and every build elsewhere, is Industrial Era
# Preview (io.github.1462316579.industrial-era.preview, build_apk.py --preview), installed beside the release and signed
# with the repository's own test key in INDUSTRIAL_ERA_DEBUG_KEYSTORE_BASE64 (alias industrial-era-debug, password
# android); a tag elsewhere publishes nothing.
on:
  push:
    branches: [android, main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      keep_symbols:
        description: Ship the library unstripped, for a profiler (simpleperf) to name its functions
        type: boolean
        default: false
      release_key:
        description: Build as a release does (release key, fast profile) without publishing, to install over a release; kept a day
        type: boolean
        default: false
      native_mods:
        description: A test with these native mods of native-mods/ compiled in (ids, separated by spaces), by native_build.sh
        type: string
        default: ''
permissions:
  contents: read
env:
  RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
  PREVIEW: ${{ !startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
jobs:
  apk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a, target: aarch64-linux-android }
          - { abi: armeabi-v7a, target: armv7-linux-androideabi }
          - { abi: x86, target: i686-linux-android }
          - { abi: x86_64, target: x86_64-linux-android }
    # The release key is only used for release builds (tagged v*); previews use the debug key.
    runs-on: ubuntu-latest
    # A release's fast profile builds slower (fewer codegen units, fewer at once: below).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # JDK 25 compiles/link-checks original exporters; the build-tools supply d8/apksigner.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install the build-tools, platform and NDK build_apk.py pins
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;35.0.0" "platforms;android-36" "ndk;28.2.13676358" > /dev/null
      - name: Install Rust for Android and cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
          cargo install cargo-ndk --version 3.5.4 --locked
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-${{ matrix.abi }}
          save-if: ${{ github.ref == 'refs/heads/android' || github.ref == 'refs/heads/main' }}
      - name: Unpack the release key
        if: env.RELEASE_BUILD == 'true'
        env:
          KEYSTORE: ${{ secrets.INDUSTRIAL_ERA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "INDUSTRIAL_ERA_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/industrial-era-release.jks"
          echo "HORIZON_ANDROID_KEYSTORE=$RUNNER_TEMP/industrial-era-release.jks" >> "$GITHUB_ENV"
      # The fast profile's 16 codegen units of the game's crate took more than the runner's 16 GB, and the runner
      # went: swap, on the large temporary disk where there is one, and three units at a time instead of four.
      - name: Make room for the release build
        if: env.RELEASE_BUILD == 'true'
        run: |
          sudo swapoff -a || true
          where=/mnt size=20G
          avail=$(df --output=avail -BG "$where" 2>/dev/null | tail -1 | tr -dc 0-9)
          if [ "${avail:-0}" -lt 30 ]; then where=$RUNNER_TEMP size=10G; fi
          sudo fallocate -l "$size" "$where/release.swap"
          sudo chmod 600 "$where/release.swap"
          sudo mkswap "$where/release.swap" > /dev/null
          sudo swapon "$where/release.swap"
          free -h
          echo "CARGO_BUILD_JOBS=3" >> "$GITHUB_ENV"
      # Where build_apk.py keeps its debug key (alias industrial-era-debug, password android).
      - name: Unpack the debug key
        if: env.RELEASE_BUILD != 'true'
        env:
          KEYSTORE: ${{ secrets.INDUSTRIAL_ERA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || exit 0
          mkdir -p target/android
          echo "$KEYSTORE" | base64 -d > target/android/debug.keystore
      - name: Build the APK
        env:
          ABI: ${{ matrix.abi }}
          HORIZON_ANDROID_KEY_ALIAS: ${{ env.RELEASE_BUILD == 'true' && secrets.INDUSTRIAL_ERA_KEY_ALIAS || 'industrial-era-debug' }}
          HORIZON_ANDROID_STORE_PASSWORD: ${{ secrets.INDUSTRIAL_ERA_STORE_PASSWORD }}
          HORIZON_ANDROID_KEY_PASSWORD: ${{ secrets.INDUSTRIAL_ERA_KEY_PASSWORD }}
          MODS: ''
          PROFILE: ${{ env.RELEASE_BUILD == 'true' && 'fast' || 'quick' }}
          VARIANT: ${{ env.PREVIEW == 'true' && '--preview' || '' }}
        # Releases with the fast profile (fewer codegen units: a little quicker in game). With native mods, the APK
        # native_build.sh makes, named after them.
        run: |
          if [ -z "$MODS" ]; then
            python packaging/android/build_apk.py --abi "$ABI" --profile "$PROFILE" $VARIANT
            exit 0
          fi
          bundles=()
          for id in $MODS; do
            [[ "$id" =~ ^[a-z0-9][a-z0-9_-]*$ && -f "native-mods/$id/mixins/$id/industrial-era-mixin.toml" ]] || \
              { echo "$id is not a mod of native-mods/"; exit 1; }
            bundles+=("native-mods/$id/mixins/$id")
          done
          bash packaging/android/native_build.sh . "$RUNNER_TEMP/native" "${bundles[@]}"
          mkdir -p target/android
          for apk in "$RUNNER_TEMP"/native/industrial-era-*.apk; do
            cp "$apk" "target/android/$(basename "${apk%.apk}")-$(echo $MODS | tr ' ' '-').apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: industrial-era-apk-${{ matrix.abi }}
          path: target/android/industrial-era-*.apk
          if-no-files-found: error
          retention-days: 90
      # The library with its symbols, to read the frames of native crashes in diagnostic ZIPs
      # (docs/android-diagnostics.md). Builds with native mods don't make one.
      - uses: actions/upload-artifact@v4
        with:
          name: industrial-era-symbols-${{ matrix.abi }}
          path: target/android/lib*-symbols.so
          if-no-files-found: ignore
          retention-days: 90

  universal:
    # One APK holding every ABI (arm64-v8a, armeabi-v7a, x86, x86_64), so a phone
    # downloads the single file that works on its architecture.
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install the build-tools, platform and NDK build_apk.py pins
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;35.0.0" "platforms;android-36" "ndk;28.2.13676358" > /dev/null
      - name: Install Rust for Android and cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android --target armv7-linux-androideabi --target i686-linux-android --target x86_64-linux-android
          rustup default stable
          cargo install cargo-ndk --version 3.5.4 --locked
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-universal
          save-if: ${{ github.ref == 'refs/heads/android' || github.ref == 'refs/heads/main' }}
      - name: Unpack the release key
        if: env.RELEASE_BUILD == 'true'
        env:
          KEYSTORE: ${{ secrets.INDUSTRIAL_ERA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "INDUSTRIAL_ERA_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/industrial-era-release.jks"
          echo "HORIZON_ANDROID_KEYSTORE=$RUNNER_TEMP/industrial-era-release.jks" >> "$GITHUB_ENV"
      - name: Make room for the release build
        if: env.RELEASE_BUILD == 'true'
        run: |
          sudo swapoff -a || true
          where=/mnt size=20G
          avail=$(df --output=avail -BG "$where" 2>/dev/null | tail -1 | tr -dc 0-9)
          if [ "${avail:-0}" -lt 30 ]; then where=$RUNNER_TEMP size=10G; fi
          sudo fallocate -l "$size" "$where/release.swap"
          sudo chmod 600 "$where/release.swap"
          sudo mkswap "$where/release.swap" > /dev/null
          sudo swapon "$where/release.swap"
          free -h
          echo "CARGO_BUILD_JOBS=3" >> "$GITHUB_ENV"
      - name: Unpack the debug key
        if: env.RELEASE_BUILD != 'true'
        env:
          KEYSTORE: ${{ secrets.INDUSTRIAL_ERA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || exit 0
          mkdir -p target/android
          echo "$KEYSTORE" | base64 -d > target/android/debug.keystore
      - name: Build the universal APK
        env:
          HORIZON_ANDROID_KEY_ALIAS: ${{ env.RELEASE_BUILD == 'true' && secrets.INDUSTRIAL_ERA_KEY_ALIAS || 'industrial-era-debug' }}
          HORIZON_ANDROID_STORE_PASSWORD: ${{ secrets.INDUSTRIAL_ERA_STORE_PASSWORD }}
          HORIZON_ANDROID_KEY_PASSWORD: ${{ secrets.INDUSTRIAL_ERA_KEY_PASSWORD }}
          PROFILE: ${{ env.RELEASE_BUILD == 'true' && 'fast' || 'quick' }}
          VARIANT: ${{ env.PREVIEW == 'true' && '--preview' || '' }}
        run: |
          python packaging/android/build_apk.py --universal --profile "$PROFILE" $VARIANT
      - uses: actions/upload-artifact@v4
        with:
          name: industrial-era-apk-universal
          path: target/android/industrial-era-*-universal.apk
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: industrial-era-symbols-universal
          path: target/android/lib*-universal-symbols.so
          if-no-files-found: ignore
          retention-days: 90

  release:
    # Publish once, only after every architecture has built and signed successfully.
    needs: [apk, universal]
    if: env.RELEASE_BUILD == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: industrial-era-apk-*
          path: target/android
          merge-multiple: true
      - name: Check all release APKs and build shared visuals
        run: |
          python3 packaging/android/release_assets.py --version "$GITHUB_REF_NAME"
      # The latest release is what the game's update prompt offers (game/update_offer.rs): the APK
      # it installs, Industrial Era Visuals beside it, and the notes written for it.
      - name: Publish the release
        if: env.RELEASE_BUILD == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/android/industrial-era-*.apk \
            target/android/IndustrialEraVisuals.zip \
            --title "Industrial Era $GITHUB_REF_NAME" --notes-file packaging/android/release-notes.md \
            --latest
      # The release's game with the sets of native-mods/prebuilt.txt (a release made with this token
      # starts no other workflow by itself; a dispatch does).
      - name: Build its native mods
        if: env.RELEASE_BUILD == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run native-mods.yml -R "$GITHUB_REPOSITORY" --ref main -f version="${GITHUB_REF_NAME#v}"
