[package]
name = "industrial-era-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Industrial Era on Android: the entry points of the client's game loop in a NativeActivity library"
publish = false

[lib]
crate-type = ["cdylib"]
# The entry points Android and the JVM look up by name (android_main, starling_on_create, the
# Java native methods); the game and its Android hooks are industrial-era-client's (src/android.rs).
path = "../industrial-era-client/src/android_lib.rs"

# Everything is Android-only: on other targets the library is empty.
[target.'cfg(target_os = "android")'.dependencies]
industrial-era-client = { path = "../industrial-era-client", default-features = false }
# The NativeActivity glue (android-activity): `android_main` gets the app.
winit = { version = "0.30.13", features = ["android-native-activity"] }
jni = "0.21.1"

[features]
# default removed to avoid ring crate compilation issues on Android with NDK
# audio = ["industrial-era-client/audio"]

[lints]
workspace = true
