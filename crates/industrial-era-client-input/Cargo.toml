[package]
name = "industrial-era-client-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "The client's input layer: key bindings and their names, mouse, controllers, clipboard and window options"

[dependencies]
industrial-era-client-core = { path = "../industrial-era-client-core" }
winit = "0.30.13"
# The window icon.
industrial-era-theme = { path = "../industrial-era-theme" }
png = "0.18"
# The DualSense's trigger effects (the `controllers` feature).
industrial-era-dualsense = { path = "../industrial-era-dualsense", optional = true }

# No Android backend: the platform's clipboard stands in there (clipboard.rs).
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }

[features]
controllers = ["dep:industrial-era-dualsense"]

[lints]
workspace = true
